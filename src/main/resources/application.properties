spring.application.name=reporting-service
server.port=${SERVER_PORT:8015}

# MySQL configuration. Create pas_reporting by running database/01_reporting_schema.sql first.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pas_reporting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL schema is managed by the provided SQL script; Hibernate must not change it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# API documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Local defaults
app.data-source-mode=${APP_DATA_SOURCE_MODE:DUMMY_DATA}
management.endpoints.web.exposure.include=health,info
